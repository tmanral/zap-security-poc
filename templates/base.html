<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Web Security Assessment{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="{% url 'assessment:landing' %}" class="site-title">
                <span class="site-logo" aria-hidden="true">&#9670;</span>
                Web Security Assessment
            </a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="{% url 'assessment:landing' %}">Home</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'assessment:dashboard' %}">Dashboard</a>
                    <form method="post" action="{% url 'accounts:logout' %}" class="nav-logout-form">
                        {% csrf_token %}
                        <button type="submit" class="nav-link-btn">Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}">Login</a>
                    <a href="{% url 'accounts:signup' %}">Sign Up</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container page-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Proof of Concept — OWASP ZAP Security Assessment</p>
        </div>
    </footer>
    {% block extra_js %}{% endblock %}
</body>
</html>
