<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Web Security Assessment{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}?v=4">
</head>
<body class="soc-body">
    <header class="site-header">
        <div class="container-fluid dashboard-container header-inner">
            <a href="{% url 'assessment:landing' %}" class="site-title">
                <i class="bi bi-shield-lock-fill site-logo-icon" aria-hidden="true"></i>
                <span>Web Security Assessment</span>
            </a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="{% url 'assessment:landing' %}"><i class="bi bi-house-door" aria-hidden="true"></i> Home</a>
                {% if user.is_authenticated %}
                    <a href="{% url 'assessment:dashboard' %}"><i class="bi bi-speedometer2" aria-hidden="true"></i> Dashboard</a>
                    <form method="post" action="{% url 'accounts:logout' %}" class="nav-logout-form">
                        {% csrf_token %}
                        <button type="submit" class="nav-link-btn"><i class="bi bi-box-arrow-right" aria-hidden="true"></i> Logout</button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}"><i class="bi bi-box-arrow-in-right" aria-hidden="true"></i> Login</a>
                    <a href="{% url 'accounts:signup' %}" class="nav-cta">Sign Up</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="container-fluid dashboard-container page-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container-fluid dashboard-container">
            <p><i class="bi bi-cpu" aria-hidden="true"></i> Proof of Concept — OWASP ZAP Security Assessment</p>
        </div>
    </footer>
    {% block modals %}{% endblock %}
    {% block extra_js %}{% endblock %}
</body>
</html>
